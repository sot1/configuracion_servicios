server.port=9000
spring.application.name=servicio-cliente-cursos

# URL base para cursos y alumnos a través del Gateway
cursos.service.url=http://localhost:8090/cursos-service

# URL base para usuarios y matrículas a través del Gateway
usuarios.service.url=http://localhost:8090/usuarios-service

# CONFIGURACION MULTIPART (SUBIDA DE ARCHIVOS)
# Maximo tamaño de archivos que se pueden subir
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
